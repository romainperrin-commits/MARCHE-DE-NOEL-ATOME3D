<script>
(function(){
  var C=window.HUB_CONFIG, screens=[].slice.call(document.querySelectorAll('.screen')), toast=document.getElementById('toast'), tt;
  function show(){
    var id=(location.hash||'#menu').slice(1); if(!document.getElementById(id)||!document.getElementById(id).dataset.screen) id='menu';
    screens.forEach(function(s){ var on=s.id===id; s.hidden=!on; s.classList.toggle('in',on); });
  }
  window.addEventListener('hashchange',show); show();
  function flash(msg){ toast.textContent=msg; toast.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove('on')},1800); }
  function copy(){
    var t=C.code;
    if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t).then(function(){flash('Code '+t+' copié !')},function(){fallback(t)});
    fallback(t);
  }
  function fallback(t){ var a=document.createElement('textarea'); a.value=t; a.style.cssText='position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');flash('Code '+t+' copié !')}catch(e){flash('Code : '+t)} a.remove(); }
  function cartUrl(g){
    var v=((C.gifts[g]||{}).variants||[]).filter(Boolean);
    if(v.length) return C.shop+'/cart/'+v.map(function(i){return i+':1'}).join(',')+'?discount='+encodeURIComponent(C.code);
    return C.shop+'/discount/'+encodeURIComponent(C.code);
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-act],[data-link]'); if(!a) return;
    if(a.dataset.act==='copy'){ e.preventDefault(); copy(); }
    else if(a.dataset.act==='profit'){ e.preventDefault(); try{navigator.clipboard&&window.isSecureContext&&navigator.clipboard.writeText(C.code)}catch(_){} window.location.href=cartUrl(a.dataset.gift); }
    else if(a.dataset.link==='game'){ e.preventDefault(); window.location.href=C.gameUrl; }
    else if(a.dataset.link==='stl'){ a.href=C.stlUrl; }
  });
})();
</script>
<script>
(function(){
  var c=document.getElementById('snow'); if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches){ if(c)c.remove(); return; }
  var x=c.getContext('2d'),W,H,D,F=[],raf;
  /* ---- vent : champ de vitesse de l'air (fluide incompressible simplifie) ---- */
  var CS=20, GW,GH, U,V,U2,V2,P,DV;          // grille d'air
  var RAD=2.2,            // rayon d'entrainement de l'air par le curseur (en cases)
      PUSH=.30,           // quantite d'air entrainee par le curseur
      DAMP=.972,          // dissipation du vent a chaque image
      GAIN=1.0;           // sensibilite des flocons au vent
  var lx=null,ly=null;
  function grid(){ GW=Math.max(8,Math.ceil(W/CS)); GH=Math.max(8,Math.ceil(H/CS)); var n=GW*GH;
    U=new Float32Array(n);V=new Float32Array(n);U2=new Float32Array(n);V2=new Float32Array(n);P=new Float32Array(n);DV=new Float32Array(n); }
  function size(){ D=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; c.width=W*D; c.height=H*D; x.setTransform(D,0,0,D,0,0); grid();
    var n=Math.round(Math.min(130,Math.max(45,W*H/14000))); while(F.length<n)F.push(mk(true)); F.length=n; }
  function mk(init){ var k=Math.max(.7,Math.min(1.5,H/900)), r=(1.2+Math.random()*2.6)*k;
    return {x:Math.random()*W,y:init?Math.random()*H:-8,r:r,v:(.35+r*.28)*(.8+Math.random()*.4),a:.22+Math.random()*.33,s:Math.random()*6.28,w:.4+Math.random()*.9,vx:0,vy:0}; }
  function inject(px,py,dx,dy){
    var gx=px/CS-.5, gy=py/CS-.5, x0=Math.floor(gx-RAD-1), x1=Math.ceil(gx+RAD+1), y0=Math.floor(gy-RAD-1), y1=Math.ceil(gy+RAD+1);
    for(var j=y0;j<=y1;j++){ if(j<1||j>=GH-1) continue;
      for(var i=x0;i<=x1;i++){ if(i<1||i>=GW-1) continue;
        var d=Math.hypot(i-gx,j-gy); if(d>RAD+1) continue;
        var g=Math.exp(-d*d/(RAD*RAD*.6)), k=j*GW+i;
        U[k]+=dx*g*PUSH; V[k]+=dy*g*PUSH; } }
  }
  addEventListener('pointermove',function(e){
    if(lx!==null){ var dx=e.clientX-lx, dy=e.clientY-ly, sp=Math.hypot(dx,dy);
      if(sp>1){ if(sp>45){ dx*=45/sp; dy*=45/sp; } inject(e.clientX,e.clientY,dx,dy); } }
    lx=e.clientX; ly=e.clientY; },{passive:true});
  document.addEventListener('mouseleave',function(){ lx=ly=null; });
  function samp(A,px,py){ var gx=px/CS-.5, gy=py/CS-.5; if(gx<0)gx=0; else if(gx>GW-1.001)gx=GW-1.001; if(gy<0)gy=0; else if(gy>GH-1.001)gy=GH-1.001;

    return (A[k]*(1-fx)+A[k+1]*fx)*(1-fy)+(A[k+GW]*(1-fx)+A[k+GW+1]*fx)*fy; }
  function project(){
    var i,j,k,it;
    for(j=1;j<GH-1;j++)for(i=1;i<GW-1;i++){ k=j*GW+i; DV[k]=-.5*(U[k+1]-U[k-1]+V[k+GW]-V[k-GW]); P[k]=0; }
    for(it=0;it<14;it++) for(j=1;j<GH-1;j++)for(i=1;i<GW-1;i++){ k=j*GW+i; P[k]=(DV[k]+P[k-1]+P[k+1]+P[k-GW]+P[k+GW])*.25; }
    for(j=1;j<GH-1;j++)for(i=1;i<GW-1;i++){ k=j*GW+i; U[k]-=.5*(P[k+1]-P[k-1]); V[k]-=.5*(P[k+GW]-P[k-GW]); }
  }

    var i,j,k,mx=0;

    if(mx<.003){ return; }

    /* advection : l'air est transporte par son propre mouvement (cree les remous) */
    for(j=1;j<GH-1;j++)for(i=1;i<GW-1;i++){ k=j*GW+i; var bx=(i+.5)*CS-U[k]*1.0, by=(j+.5)*CS-V[k]*1.0;
      U2[k]=samp(U,bx,by)*DAMP; V2[k]=samp(V,bx,by)*DAMP; }

    project();
  }
  function tick(){ x.clearRect(0,0,W,H); air();
    for(var i=0;i<F.length;i++){ var f=F[i]; f.s+=.012;
      var wu=samp(U,f.x,f.y)*GAIN, wv=samp(V,f.x,f.y)*GAIN, kk=.09/(.6+f.r*.28);

      if(f.y>H+8||f.x<-40||f.x>W+40||f.y<-60){ F[i]=mk(false); continue; }
      x.globalAlpha=f.a; x.fillStyle='#fff'; x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill(); }
